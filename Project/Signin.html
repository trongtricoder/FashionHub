<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - FashionHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pastel: '#F8DCE7', main: '#D985A7', light: '#FFF7FA', darkmodal: '#333333' } } }
        }
    </script>
</head>
<body class="bg-light h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Nút chuyển đổi ngôn ngữ (VN / EN) -->
    <div class="absolute top-6 right-8 flex bg-white rounded-full shadow-md overflow-hidden border border-gray-100 z-10">
        <button id="btn-vi" class="px-4 py-2 text-sm font-bold bg-pastel text-main transition">VN</button>
        <button id="btn-en" class="px-4 py-2 text-sm font-bold text-gray-400 hover:text-main transition">EN</button>
    </div>

    <!-- Nút quay lại trang chủ -->
    <a href="Home.html" class="absolute top-6 left-8 px-4 py-2 text-sm font-bold text-gray-500 hover:text-main bg-white rounded-full shadow-md transition flex items-center gap-1">
        &larr; <span data-i18n="back_home">Trang chủ</span>
    </a>

    <!-- Form Đăng nhập -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md relative z-10">
        <!-- Logo - NHÁY ĐÚP ĐỂ VÀO QUYỀN ADMIN -->
        <div class="text-center mb-6">
            <img id="admin-trigger-logo" title="Double click for Admin Access" 
                 src="assets/logo.png" 
                 class="h-20 w-20 mx-auto rounded-full shadow-md cursor-pointer hover:scale-105 transition-transform" alt="Logo">
            <h2 class="text-2xl font-bold mt-3 text-gray-800" data-i18n="welcome">Chào mừng trở lại!</h2>
        </div>

        <!-- Tabs -->
        <div class="flex border-b mb-6">
            <button id="tab-login" class="flex-1 py-2 font-semibold text-main border-b-2 border-main transition-colors" data-i18n="login_tab">Đăng nhập</button>
            <button id="tab-register" class="flex-1 py-2 font-semibold text-gray-400 hover:text-main transition-colors" data-i18n="register_tab">Đăng ký</button>
        </div>

        <form id="auth-form" class="space-y-4">
            <!-- Vai trò -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="role_label">Bạn là:</label>
                <select id="user-role" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-main focus:outline-none bg-white">
                    <option value="buyer" data-i18n="role_buyer">Người mua (Buyer)</option>
                    <option value="seller" data-i18n="role_seller">Người bán (Seller)</option>
                </select>
            </div>
            
            <div id="email-field" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="email_label">Email:</label>
                <input type="email" id="email-input" data-i18n-plh="email_plh" placeholder="Nhập Email của bạn" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-main focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="user_label">Username / Tên đăng nhập:</label>
                <input type="text" id="username" required data-i18n-plh="user_plh" placeholder="Tên đăng nhập" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-main focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="pass_label">Mật khẩu:</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-main focus:outline-none">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-main text-white font-bold py-3 rounded-lg shadow-lg hover:bg-pink-600 transition-colors" data-i18n="btn_login">
                Đăng Nhập Ngay
            </button>
        </form>
    </div>

    <!-- ================= CUSTOM MODAL: NHẬP PASSWORD ADMIN ================= -->
    <div id="admin-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-6 shadow-2xl max-w-sm w-full transform transition-all scale-95 opacity-0" id="admin-modal-box">
            <h3 class="text-xl font-bold mb-2 text-main" data-i18n="admin_title">HỆ THỐNG QUẢN TRỊ</h3>
            <p class="text-sm text-gray-600 mb-4" data-i18n="admin_msg">Vui lòng nhập mật khẩu Admin để truy cập:</p>
            <input type="password" id="admin-pass-input" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-main focus:outline-none mb-6">
            <div class="flex justify-end gap-3">
                <button id="admin-btn-cancel" class="px-4 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg transition" data-i18n="admin_btn_cancel">Hủy</button>
                <button id="admin-btn-submit" class="px-4 py-2 bg-main text-white font-bold rounded-lg hover:bg-pink-600 transition" data-i18n="admin_btn_submit">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- ================= CUSTOM MODAL: THÔNG BÁO LỖI ================= -->
    <div id="alert-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-start justify-center pt-20">
        <div class="bg-darkmodal rounded-2xl p-6 shadow-2xl max-w-sm w-full text-white transform transition-all scale-95 opacity-0" id="alert-modal-box">
            <h3 class="text-lg font-bold mb-2 text-red-400" data-i18n="alert_title">Thông báo</h3>
            <p id="alert-message" class="text-sm text-gray-300 mb-6" data-i18n="alert_error">Sai mật khẩu truy cập hệ thống!</p>
            <div class="flex justify-end">
                <button id="alert-btn-ok" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-full transition shadow-lg" data-i18n="alert_ok">
                    Đóng
                </button>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script src="/assets/js/core/api.js"></script>
    <script>
        // --- 1. NGÔN NGỮ (I18N) LOGIC ---
        let currentLang = 'vi';
        
        const translations = {
            vi: {
                back_home: "Trang chủ",
                welcome: "Chào mừng trở lại!",
                login_tab: "Đăng nhập",
                register_tab: "Đăng ký",
                role_label: "Bạn là:",
                role_buyer: "Người mua (Buyer)",
                role_seller: "Người bán (Seller)",
                email_label: "Email:",
                email_plh: "Nhập Email của bạn",
                user_label: "Username / Tên đăng nhập:",
                user_plh: "Tên đăng nhập",
                pass_label: "Mật khẩu:",
                btn_login: "Đăng Nhập Ngay",
                btn_register: "Tạo Tài Khoản",
                admin_title: "HỆ THỐNG QUẢN TRỊ",
                admin_msg: "Vui lòng nhập mật khẩu Admin để truy cập:",
                admin_btn_cancel: "Hủy",
                admin_btn_submit: "Xác nhận",
                alert_title: "Thông báo",
                alert_error: "Sai mật khẩu truy cập hệ thống!",
                alert_ok: "Đóng"
            },
            en: {
                back_home: "Home",
                welcome: "Welcome back!",
                login_tab: "Login",
                register_tab: "Register",
                role_label: "You are:",
                role_buyer: "Buyer",
                role_seller: "Seller",
                email_label: "Email:",
                email_plh: "Enter your email",
                user_label: "Username:",
                user_plh: "Username",
                pass_label: "Password:",
                btn_login: "Login Now",
                btn_register: "Create Account",
                admin_title: "ADMIN SYSTEM",
                admin_msg: "Please enter Admin password to access:",
                admin_btn_cancel: "Cancel",
                admin_btn_submit: "Confirm",
                alert_title: "Notification",
                alert_error: "Incorrect access password!",
                alert_ok: "Close"
            }
        };

        function setLang(lang) {
            currentLang = lang;
            
            // Đổi giao diện active nút ngôn ngữ
            if (lang === 'vi') {
                document.getElementById('btn-vi').className = "px-4 py-2 text-sm font-bold bg-pastel text-main transition";
                document.getElementById('btn-en').className = "px-4 py-2 text-sm font-bold text-gray-400 hover:text-main transition";
            } else {
                document.getElementById('btn-en').className = "px-4 py-2 text-sm font-bold bg-pastel text-main transition";
                document.getElementById('btn-vi').className = "px-4 py-2 text-sm font-bold text-gray-400 hover:text-main transition";
            }

            // Dịch toàn bộ các thẻ có thuộc tính data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // Dịch placeholder của input
            document.querySelectorAll('[data-i18n-plh]').forEach(el => {
                const key = el.getAttribute('data-i18n-plh');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            updateSubmitBtnText();
        }

        // Gắn sự kiện click đổi ngôn ngữ trực tiếp qua JS
        document.getElementById('btn-vi').addEventListener('click', () => setLang('vi'));
        document.getElementById('btn-en').addEventListener('click', () => setLang('en'));

        // --- 2. LOGIC TABS ĐĂNG NHẬP / ĐĂNG KÝ ---
        let isLogin = true;
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const emailField = document.getElementById('email-field');
        const submitBtn = document.getElementById('submit-btn');

        function updateSubmitBtnText() {
            if(isLogin) {
                submitBtn.textContent = translations[currentLang]['btn_login'];
            } else {
                submitBtn.textContent = translations[currentLang]['btn_register'];
            }
        }

        function switchTab(login) {
            isLogin = login;
            if(login) {
                tabLogin.classList.add('text-main', 'border-main');
                tabLogin.classList.remove('text-gray-400', 'border-transparent');
                tabRegister.classList.add('text-gray-400', 'border-transparent');
                tabRegister.classList.remove('text-main', 'border-main');
                emailField.classList.add('hidden');
                document.getElementById('email-input').required = false;
            } else {
                tabRegister.classList.add('text-main', 'border-main');
                tabRegister.classList.remove('text-gray-400', 'border-transparent');
                tabLogin.classList.add('text-gray-400', 'border-transparent');
                tabLogin.classList.remove('text-main', 'border-main');
                emailField.classList.remove('hidden');
                document.getElementById('email-input').required = true;
            }
            updateSubmitBtnText();
        }
        tabLogin.addEventListener('click', () => switchTab(true));
        tabRegister.addEventListener('click', () => switchTab(false));

                // Gửi form: đăng nhập (hoặc đăng ký rồi đăng nhập) thật qua server, chuyển trang theo vai trò thật của tài khoản
        document.getElementById('auth-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            submitBtn.disabled = true;
            try {
                if (!isLogin) {
                    await api('/auth/register', { method: 'POST', auth: false, body: {
                        username, password,
                        email: document.getElementById('email-input').value.trim(),
                        role: document.getElementById('user-role').value
                    }});
                }
                const session = await api('/auth/login', { method: 'POST', auth: false,
                    body: { identifier: username, password } });
                saveSession(session);
                if (session.me.must_change_password) {
                    window.location.href = 'change-password.html';
                    return;
                }
                const role = session.me.role;
                if (role === 'buyer') window.location.href = 'Buyer.html';
                else if (role === 'seller') window.location.href = 'Seller/index.html';
                else window.location.href = 'Admin.html';
            } catch (err) {
                document.getElementById('alert-message').textContent = err.message;
                showAlertModal();
            } finally {
                submitBtn.disabled = false;
            }
        });

        // --- 3. CUSTOM MODAL ADMIN & ALERT LOGIC ---
        const adminModal = document.getElementById('admin-modal');
        const adminModalBox = document.getElementById('admin-modal-box');
        const adminPassInput = document.getElementById('admin-pass-input');

        const alertModal = document.getElementById('alert-modal');
        const alertModalBox = document.getElementById('alert-modal-box');

        // Mở popup Admin khi nháy đúp Logo
        document.getElementById('admin-trigger-logo').addEventListener('dblclick', function() {
            adminPassInput.value = '';
            adminModal.classList.remove('hidden');
            setTimeout(() => {
                adminModalBox.classList.remove('scale-95', 'opacity-0');
                adminModalBox.classList.add('scale-100', 'opacity-100');
                adminPassInput.focus();
            }, 10);
        });

        function closeAdminModal() {
            adminModalBox.classList.remove('scale-100', 'opacity-100');
            adminModalBox.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { adminModal.classList.add('hidden'); }, 200);
        }

        document.getElementById('admin-btn-cancel').addEventListener('click', closeAdminModal);

        function submitAdminPass() {
            if (adminPassInput.value === 'admin') {
                window.location.href = 'Admin.html';
            } else {
                closeAdminModal();
                setTimeout(() => {
                    showAlertModal();
                }, 250);
            }
        }

        document.getElementById('admin-btn-submit').addEventListener('click', submitAdminPass);
        adminPassInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitAdminPass();
        });

        function showAlertModal() {
            alertModal.classList.remove('hidden');
            setTimeout(() => {
                alertModalBox.classList.remove('scale-95', 'opacity-0');
                alertModalBox.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeAlertModal() {
            alertModalBox.classList.remove('scale-100', 'opacity-100');
            alertModalBox.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { alertModal.classList.add('hidden'); }, 200);
        }

        document.getElementById('alert-btn-ok').addEventListener('click', closeAlertModal);

        // Khởi tạo ngôn ngữ mặc định là Tiếng Việt khi tải trang
        setLang('vi');
    </script>
</body>
</html>
