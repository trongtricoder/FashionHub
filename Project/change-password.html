<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu - Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { pastel: '#F8DCE7', main: '#D985A7', light: '#FFF7FA' } } } }
  </script>
  <script src="/assets/js/core/api.js"></script>
</head>
<body class="bg-light font-sans text-gray-800 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 w-full max-w-md">
    <h1 class="text-2xl font-black text-main tracking-widest mb-1">FASHION</h1>
    <h2 class="text-xl font-bold mb-2">Đổi mật khẩu</h2>
    <p id="notice" class="text-sm text-gray-500 mb-5"></p>

    <form id="pw-form" class="space-y-4">
      <div>
        <label for="new-pass" class="block text-sm font-bold text-gray-600 mb-1">Mật khẩu mới</label>
        <input id="new-pass" type="password" minlength="6" maxlength="72" required autocomplete="new-password"
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-main focus:outline-none">
      </div>
      <div>
        <label for="confirm-pass" class="block text-sm font-bold text-gray-600 mb-1">Nhập lại mật khẩu mới</label>
        <input id="confirm-pass" type="password" minlength="6" maxlength="72" required autocomplete="new-password"
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-main focus:outline-none">
      </div>
      <p id="error" class="text-sm text-red-500 hidden"></p>
      <button id="submit-btn" type="submit" class="w-full bg-main text-white font-bold py-2 rounded-lg hover:bg-pink-600 transition">Cập nhật mật khẩu</button>
    </form>
  </div>

  <script>
    const session = getSession();
    if (!session || !session.me) window.location.href = LOGIN_PAGE;   // chưa đăng nhập thì về trang đăng nhập

    const HOME = { buyer: 'Buyer.html', seller: 'Seller/index.html', admin: 'Admin.html' };

    if (session && session.me) {
      document.getElementById('notice').innerText = session.me.must_change_password
        ? 'Bạn đang dùng mật khẩu tạm do Admin cấp. Vui lòng đặt mật khẩu mới để tiếp tục.'
        : 'Nhập mật khẩu mới cho tài khoản của bạn.';
    }

    function showError(message) {
      const el = document.getElementById('error');
      el.innerText = message;
      el.classList.remove('hidden');
    }

    document.getElementById('pw-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = document.getElementById('new-pass').value;
      const confirmPassword = document.getElementById('confirm-pass').value;
      const btn = document.getElementById('submit-btn');
      document.getElementById('error').classList.add('hidden');
      if (password.length < 6) return showError('Mật khẩu mới tối thiểu 6 ký tự.');
      if (password !== confirmPassword) return showError('Hai mật khẩu nhập lại chưa khớp.');

      btn.disabled = true;
      try {
        await api('/me/change-password', { method: 'POST', body: { new_password: password } });
        session.me.must_change_password = false;
        saveSession(session);
        window.location.href = HOME[session.me.role] || LOGIN_PAGE;
      } catch (err) {
        if (err.status === 401) { window.location.href = LOGIN_PAGE; return; }
        showError(err.message);
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
